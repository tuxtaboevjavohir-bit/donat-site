<!DOCTYPE html><html lang="ru" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Админка · Донат-алерт</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&subset=cyrillic&display=swap">
<style>
:root{--c1:#ff4d5e;--c2:#ff8a3d;--bg:#0d0d14;--card:#16161f;--ln:#262634;--tx:#f4f3f8;--mut:#9a98ab;--in:#1d1d29;--ok:#35d07f}
@media(prefers-color-scheme:light){:root{--bg:#f4f3f8;--card:#fff;--ln:#e4e2ec;--tx:#17161d;--mut:#6c6a7a;--in:#f4f3f8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Manrope',system-ui,sans-serif}
.w{max-width:960px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0 12px}.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center}.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(130deg,var(--c1),var(--c2))}
.logo small{font-size:12px;color:var(--mut);font-weight:700;border:1px solid var(--ln);border-radius:8px;padding:2px 7px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--mut);border-radius:99px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;position:relative}
.tab.on{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--c1),var(--c2))}
.bd{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--c1);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:6px;padding:0 5px}.tab.on .bd{background:#fff;color:var(--c1)}
.pane{display:none}.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:17px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.s{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}.s small{color:var(--mut);font-weight:600}.s b{display:block;font-size:22px;font-weight:800}
button{font:inherit;cursor:pointer}.b{border:1px solid var(--ln);background:var(--in);color:var(--tx);border-radius:11px;padding:8px 12px;font-weight:700}.b.p{border:0;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2))}.b.d{color:#ff6b6b}.b.sm{padding:5px 9px;font-size:13px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:11px;background:var(--in);color:var(--tx);font:inherit;outline:0}input:focus,textarea:focus{border-color:var(--c1)}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 5px}.hint{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);flex-wrap:wrap}.it:first-child{border-top:0}.it .m{flex:1;min-width:150px}.it .n{font-weight:800}.it .t{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--in);color:var(--mut)}.tag.pro{background:rgba(53,208,127,.18);color:var(--ok)}.tag.max{background:rgba(255,138,61,.2);color:var(--c2)}.tag.w{background:rgba(255,184,0,.18);color:#ffb800}.tag.r{background:rgba(255,77,94,.18);color:var(--c1)}
.chat{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}.msg{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--in);overflow-wrap:anywhere;white-space:pre-wrap}.msg.a{align-self:flex-end;background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:700px){.g{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;margin-top:8px}.chk input{width:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#222;color:#fff;border-radius:99px;padding:10px 18px;font-weight:700;transition:.3s;z-index:9}.toast.on{transform:translateX(-50%)}
</style></head><body><div class="w" id="app"><div class="hint">Загрузка…</div></div><div class="toast" id="toast"></div>
<script>
var tok='';try{tok=localStorage.getItem('tok')||''}catch(e){}
var $=function(i){return document.getElementById(i)},D=null,cur='slug',curSlug=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fm(n){return Number(n).toLocaleString('ru-RU')+' ₸'}
function dt(ts){return ts?new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}
function toast(t){var e=$('toast');e.textContent=t;e.className='toast on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className='toast'},1800)}
function api(p,b){var o={method:b?'POST':'GET',headers:{'x-token':tok}};if(b){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}
 return fetch(p,o).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error==='admin'?'Нет доступа':(j.error||'Ошибка'));return j})})}
function tag(p){return '<span class="tag '+(p==='pro'?'pro':p==='max'?'max':'')+'">'+esc(p.toUpperCase())+'</span>'}
function load(){return api('/api/admin').then(function(d){D=d;if(!$('t-o'))build();paint()}).catch(function(e){$('app').innerHTML='<div class="card"><h3>Админка</h3><p class="hint">'+esc(e.message)+'. Войдите в <a href="/panel" style="color:var(--c1)">панель</a> под аккаунтом администратора (ник из переменной ADMIN_SLUGS на Railway).</p></div>'})}
var TABS=[['o','Обзор'],['p','Оплаты'],['m','Сообщения'],['s','Стримеры'],['t','Тарифы'],['x','Настройки']];
function build(){var h='<div class="top"><div class="logo"><i></i>Админка <small>owner</small></div><a class="b sm" href="/panel" style="text-decoration:none">Моя панель</a></div><div class="tabs">';
 TABS.forEach(function(t,i){h+='<button class="tab'+(i?'':' on')+'" data-t="'+t[0]+'" id="t-'+t[0]+'">'+t[1]+'<span class="bd" id="bd-'+t[0]+'" style="display:none"></span></button>'});h+='</div>';
 TABS.forEach(function(t,i){h+='<div class="pane'+(i?'':' on')+'" id="p-'+t[0]+'"></div>'});$('app').innerHTML=h;
 document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b)});document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id==='p-'+b.dataset.t)})}})}
function badge(id,n){var e=$('bd-'+id);e.style.display=n>0?'inline-block':'none';e.textContent=n}
var editing=false;
function paint(){var s=D.stats;badge('p',s.pending);badge('m',s.unread);
 $('p-o').innerHTML='<div class="st"><div class="s"><small>Стримеров</small><b>'+s.streamers+'</b></div><div class="s"><small>Платных</small><b>'+s.paid+'</b></div><div class="s"><small>Заявок на оплату</small><b>'+s.pending+'</b></div><div class="s"><small>Новых сообщений</small><b>'+s.unread+'</b></div><div class="s"><small>Донатов всего</small><b>'+s.donations+'</b></div><div class="s"><small>Выручка за 30 дн.</small><b>'+fm(s.revenueMonth)+'</b></div><div class="s"><small>Выручка всего</small><b>'+fm(s.revenue)+'</b></div></div><div class="card"><h3>Админы</h3><p class="hint">'+esc(D.admins.join(', '))+' — задаются переменной ADMIN_SLUGS на Railway (через запятую).</p></div>';
 var ph='';D.payments.forEach(function(x){ph+='<div class="it"><div class="m"><div class="n">'+esc(x.slug)+' → '+tag(x.plan)+' · '+x.months+' мес.</div><div class="t">'+dt(x.ts)+'</div></div><div class="n">'+fm(x.amount)+'</div>'+(x.status==='pending'?'<button class="b sm p" data-pa="approve" data-id="'+x.id+'">Подтвердить</button><button class="b sm d" data-pa="reject" data-id="'+x.id+'">Отклонить</button>':'<span class="tag '+(x.status==='approved'?'pro':'r')+'">'+(x.status==='approved'?'оплачено':'отклонено')+'</span>')+'</div>'});
 $('p-p').innerHTML='<div class="card"><h3>Заявки на оплату</h3><p class="hint">Стример пишет «Я оплатил» → проверьте поступление в Kaspi → «Подтвердить». Тариф включится на оплаченный срок.</p>'+(ph||'<p class="hint">Пока нет заявок</p>')+'</div>';
 var ch='';D.chats.forEach(function(c){ch+='<div class="it" data-ch="'+esc(c.slug)+'" style="cursor:pointer"><div class="m"><div class="n">'+esc(c.name)+' '+tag(c.plan)+(c.plan==='max'?' <span class="tag w">приоритет</span>':'')+(c.unread?' <span class="tag r">новое: '+c.unread+'</span>':'')+'</div><div class="t">'+(c.from==='a'?'Вы: ':'')+esc(c.last)+'</div></div><div class="t">'+dt(c.ts)+'</div></div>'});
 var ct='';D.contacts.forEach(function(c){ct+='<div class="it"><div class="m"><div class="n">'+esc(c.name||'Без имени')+' '+(c.done?'<span class="tag pro">готово</span>':'<span class="tag r">новое</span>')+'</div><div class="t">'+esc(c.contact)+' · '+dt(c.ts)+'</div><div class="t" style="color:var(--tx)">'+esc(c.text)+'</div></div><button class="b sm" data-cd="'+(c.done?0:1)+'" data-id="'+c.id+'">'+(c.done?'Вернуть':'Готово')+'</button><button class="b sm d" data-cx="1" data-id="'+c.id+'">✕</button></div>'});
 if(!editing)$('p-m').innerHTML='<div class="card"><h3>Чаты со стримерами</h3>'+(ch||'<p class="hint">Пока нет сообщений</p>')+'</div><div id="cv"></div><div class="card"><h3>Обращения без аккаунта</h3><p class="hint">Заполнили форму на главной странице.</p>'+(ct||'<p class="hint">Пока нет</p>')+'</div>';
 var sh='';D.streamers.forEach(function(x){sh+='<div class="it"><div class="m"><div class="n"><a href="/s/'+esc(x.slug)+'" target="_blank" style="color:inherit">'+esc(x.name)+'</a> <span class="t">@'+esc(x.slug)+'</span> '+tag(x.plan)+(x.banned?' <span class="tag r">бан</span>':'')+'</div><div class="t">донатов: '+x.donations+' на '+fm(x.total)+' · использовано в месяце: '+x.used+(x.until&&x.plan!=='free'?' · до '+new Date(x.until).toLocaleDateString('ru-RU'):'')+' · '+esc(x.kaspi||'без Kaspi')+'</div></div>'
  +(x.admin?'':'<select data-gp="'+esc(x.slug)+'" style="width:90px"><option value="pro">Pro</option><option value="max">Max</option><option value="free">Free</option></select><input data-gd="'+esc(x.slug)+'" type="number" value="30" style="width:70px" title="дней"><button class="b sm" data-g="'+esc(x.slug)+'">Выдать</button><button class="b sm d" data-b="'+esc(x.slug)+'" data-v="'+(x.banned?0:1)+'">'+(x.banned?'Разбан':'Бан')+'</button>')+'</div>'});
 if(!editing&&!$('p-s').contains(document.activeElement))$('p-s').innerHTML='<div class="card"><h3>Стримеры ('+D.streamers.length+')</h3>'+sh+'</div>';
 if(!$('pl-pro')){var pl='<div class="g">';['free','pro','max'].forEach(function(k){var p=D.plans[k];pl+='<div class="card" style="margin:0"><h3>'+k.toUpperCase()+'</h3><label>Название</label><input id="pl-'+k+'" value="'+esc(p.name)+'" data-k="'+k+'" data-f="name">'+(k==='free'?'':'<label>Цена за месяц, ₸</label><input type="number" data-k="'+k+'" data-f="price" value="'+p.price+'">')
  +'<label>Донатов в месяц (−1 = без лимита)</label><input type="number" data-k="'+k+'" data-fn="alerts" value="'+p.f.alerts+'"><label>История донатов, шт.</label><input type="number" data-k="'+k+'" data-fn="history" value="'+p.f.history+'">'
  +[['design','Свои цвета, шрифты, позиция'],['sounds','Все звуки'],['tts','Озвучка'],['goal','Цель сбора'],['top','Топ донатеров'],['filters','Фильтры и чёрный список'],['brand','Значок сервиса в плашке'],['prio','Приоритетная поддержка'],['star','Звезда в рейтинге']].map(function(f){return '<label class="chk"><input type="checkbox" data-k="'+k+'" data-fb="'+f[0]+'"'+(p.f[f[0]]?' checked':'')+'>'+f[1]+'</label>'}).join('')+'</div>'});
  $('p-t').innerHTML='<p class="hint">Что даёт каждый тариф. Изменения действуют сразу для всех.</p>'+pl+'</div><button class="b p" id="svp" style="margin-top:12px;padding:12px 20px">Сохранить тарифы</button>'}
 if(!$('kp'))$('p-x').innerHTML='<div class="card"><h3>Оплата и контакты</h3><label>Ваш номер Kaspi для приёма оплаты</label><input id="kp" value="'+esc(D.settings.kaspi)+'" placeholder="+7 7xx xxx xx xx"><label>Telegram (ссылка или @ник)</label><input id="tg" value="'+esc(D.settings.tg)+'"><label>WhatsApp (номер или ссылка)</label><input id="wa" value="'+esc(D.settings.wa)+'"><div class="row" style="margin-top:12px"><button class="b p" id="sx">Сохранить</button></div><p class="hint">Номер Kaspi увидят стримеры на вкладке «Тариф». Контакты — на главной странице и в поддержке.</p></div>';
}
function openChat(slug){curSlug=slug;api('/api/admin/chat?slug='+encodeURIComponent(slug)).then(function(d){var h='<div class="card"><h3>Чат: '+esc(slug)+'</h3><div class="chat" id="cb">'+d.msgs.map(function(m){return '<div class="msg '+(m.f==='a'?'a':'')+'">'+esc(m.t)+'</div>'}).join('')+'</div><textarea id="rt" rows="2" placeholder="Ответ стримеру"></textarea><div class="row" style="margin-top:8px"><button class="b p" id="rs">Отправить</button><button class="b" id="rc">Закрыть</button></div></div>';
 $('cv').innerHTML=h;var cb=$('cb');cb.scrollTop=cb.scrollHeight;editing=true;
 $('rs').onclick=function(){var t=$('rt').value.trim();if(!t)return;api('/api/admin/reply',{slug:slug,text:t}).then(function(){toast('Отправлено');openChat(slug)}).catch(function(e){toast(e.message)})};
 $('rc').onclick=function(){$('cv').innerHTML='';editing=false;curSlug=null;load()}})}
document.addEventListener('click',function(e){var t=e.target,c=t.closest&&t.closest('[data-ch]');
 if(t.dataset.pa){api('/api/admin/pay',{id:t.dataset.id,action:t.dataset.pa}).then(function(){toast('Готово');load()}).catch(function(x){toast(x.message)});return}
 if(t.dataset.cd!=null&&t.dataset.id){api('/api/admin/contact',{id:t.dataset.id,done:t.dataset.cd==='1'}).then(function(){load()});return}
 if(t.dataset.cx){if(confirm('Удалить обращение?'))api('/api/admin/contact',{id:t.dataset.id,action:'delete'}).then(function(){load()});return}
 if(t.dataset.g){var sl=t.dataset.g,pl=document.querySelector('[data-gp="'+sl+'"]').value,dd=document.querySelector('[data-gd="'+sl+'"]').value;api('/api/admin/grant',{slug:sl,plan:pl,days:dd}).then(function(){toast('Тариф выдан');load()}).catch(function(x){toast(x.message)});return}
 if(t.dataset.b){api('/api/admin/ban',{slug:t.dataset.b,banned:t.dataset.v==='1'}).then(function(){toast('Готово');load()}).catch(function(x){toast(x.message)});return}
 if(t.id==='svp'){var P={free:{f:{}},pro:{f:{}},max:{f:{}}};document.querySelectorAll('#p-t [data-k]').forEach(function(i){var k=i.dataset.k;if(i.dataset.f)P[k][i.dataset.f]=i.value;else if(i.dataset.fn)P[k].f[i.dataset.fn]=i.value;else if(i.dataset.fb)P[k].f[i.dataset.fb]=i.checked});
  api('/api/admin/plans',{plans:P}).then(function(){toast('Тарифы сохранены');load()}).catch(function(x){toast(x.message)});return}
 if(t.id==='sx'){api('/api/admin/settings',{kaspi:$('kp').value,tg:$('tg').value,wa:$('wa').value}).then(function(){toast('Сохранено')}).catch(function(x){toast(x.message)});return}
 if(c)openChat(c.dataset.ch)});
if(!tok)$('app').innerHTML='<div class="card"><h3>Админка</h3><p class="hint">Сначала войдите в <a href="/panel" style="color:var(--c1)">панель</a>, потом вернитесь сюда.</p></div>';else{load();setInterval(function(){if(!editing)load()},15000)}
</script></body></html>
