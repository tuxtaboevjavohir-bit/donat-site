 var nh=M.news.length?M.news.map(function(n){return '<div class="nw"><div class="nt">'+esc(n.title)+'</div><div class="nd">'+new Date(n.ts).toLocaleDateString('ru-RU')+'</div>'+(n.text?'<p>'+esc(n.text)+'</p>':'')+'</div>'}).join(''):'<p class="hint">Новостей пока нет.</p>';
