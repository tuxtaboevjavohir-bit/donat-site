<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Донат-алерт</title><style>:root{--bg:#f6f5f2;--cd:#fff;--tx:#1c1b19;--mu:#6b6860;--ln:#e3e0d9;--ac:#e8333c}@media(prefers-color-scheme:dark){:root{--bg:#161615;--cd:#212120;--tx:#f1efe9;--mu:#9c998f;--ln:#34332f}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.w{max-width:640px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;margin:0 0 4px}.s{color:var(--mu);font-size:14px;margin:0 0 16px}.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}input,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.r{display:flex;gap:10px}.r>*{flex:1}button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;padding:10px 14px}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:14px;padding:13px}button.z{padding:6px 10px;font-size:13px}.er{color:var(--ac);font-size:14px;margin-top:8px}.it{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.it:first-child{border-top:0}.it .m{flex:1;min-width:0;overflow-wrap:anywhere}.it b{white-space:nowrap}.mu{color:var(--mu);font-size:14px}.t{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}code{display:block;word-break:break-all;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;font-size:13px;margin-top:6px}</style></head><body><div class="w" id="a"></div>
<script>
var T=localStorage.getItem('tk'),A=document.getElementById('a'),$=function(i){return document.getElementById(i)};
function api(p,b){return fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','X-Token':T||''},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function fmt(n){return Number(n).toLocaleString('ru-RU')+' ₸'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function login(){
 A.innerHTML='<h1>Донат-алерт</h1><p class="s">Уведомления о донатах Kaspi в вашем TikTok-эфире</p><div class="c"><label>Ник (для ссылки)</label><input id="sl" placeholder="aidos"><label>Пароль</label><input id="pw" type="password"><div id="rg" style="display:none"><label>Имя на странице доната</label><input id="nm"><label>Номер Kaspi для переводов</label><input id="kp" placeholder="+7 7xx xxx xx xx"></div><div class="er" id="er"></div><button class="p" id="go">Войти</button><div class="t"><button class="z" id="sw">Нет аккаунта? Регистрация</button></div></div>';
 var reg=false;$('sw').onclick=function(){reg=!reg;$('rg').style.display=reg?'block':'none';$('go').textContent=reg?'Создать аккаунт':'Войти';$('sw').textContent=reg?'Уже есть аккаунт':'Нет аккаунта? Регистрация'};
 $('go').onclick=function(){api(reg?'/api/register':'/api/login',{slug:$('sl').value,password:$('pw').value,name:reg?$('nm').value:'',kaspi:reg?$('kp').value:''}).then(function(j){T=j.token;localStorage.setItem('tk',T);panel()}).catch(function(e){$('er').textContent=e.error||'Ошибка'})}}
function panel(){
 api('/api/me').then(function(me){
  var base=location.origin,dl=base+'/s/'+me.slug,ol=base+'/overlay/'+me.slug+'?key='+me.okey;
  var pend=me.donations.filter(function(d){return d.status==='pending'}),rest=me.donations.filter(function(d){return d.status!=='pending'});
  var tot=me.donations.filter(function(d){return d.status==='confirmed'}).reduce(function(a,d){return a+d.amount},0);
  function row(d,p){return '<div class="it"><div class="m"><b>'+esc(d.name)+'</b><div class="mu">'+esc(d.msg||'без сообщения')+'</div></div><b>'+fmt(d.amount)+'</b>'+(p?'<button class="z" data-c="'+d.id+'">Подтвердить</button><button class="z" data-x="'+d.id+'">✕</button>':(d.status==='confirmed'?'<button class="z" data-r="'+d.id+'">Ещё раз</button>':'<span class="mu">отклонён</span>'))+'</div>'}
  A.innerHTML='<h1>'+esc(me.name)+'</h1><p class="s">Подтверждено: '+fmt(tot)+' · <a href="#" id="lo">Выйти</a></p>'
  +'<div class="c"><b>Ждут подтверждения ('+pend.length+')</b><p class="mu">Сверьте с уведомлением Kaspi и нажмите «Подтвердить»: плашка сразу появится в эфире.</p><label class="mu"><input type="checkbox" id="tts" style="width:auto"> озвучить сообщение</label><div id="pl">'+(pend.map(function(d){return row(d,1)}).join('')||'<p class="mu">Пока никого</p>')+'</div></div>'
  +'<div class="c"><b>Добавить вручную</b><div class="r"><input id="mn" placeholder="Имя"><input id="ma" type="number" placeholder="Сумма"></div><input id="mm" placeholder="Сообщение" style="margin-top:8px"><button class="p" id="mb" style="margin-top:10px">Показать в эфире</button></div>'
  +'<div class="c"><b>Ссылки</b><p class="mu">Страница для зрителей (в описание профиля и в чат):</p><code>'+esc(dl)+'</code><p class="mu">Оверлей. Вставьте как «Link» в TikTok LIVE Studio или «Browser Source» в OBS. Ссылка секретная, не показывайте её в эфире:</p><code>'+esc(ol)+'</code><div class="t"><button class="z" id="ts">Тест уведомления</button></div></div>'
  +'<div class="c"><b>Автоматически с iPhone</b><p class="mu">1. «Команды» → «Автоматизация» → «+» → «Уведомление» → выберите Kaspi.kz, «Запускать немедленно». 2. Действие «Получить содержимое URL»: URL — адрес ниже, метод POST, тело запроса JSON с полями text (Текст уведомления) и title (Название).</p><code>'+esc(base+'/api/notify?key='+me.nkey)+'</code><label class="mu"><input type="checkbox" id="au" style="width:auto"'+(me.auto?' checked':'')+'> показывать в эфире сразу, если заявки зрителя нет (иначе уйдёт в «Ждут подтверждения»)</label><p class="mu"><b>Последние уведомления с телефона</b> (хранятся 20 последних):</p>'+(me.log.map(function(l){return '<div class="it"><div class="m mu">'+esc(l.raw.slice(0,140))+'</div><b>'+esc(l.result)+'</b></div>'}).join('')||'<p class="mu">Пока ничего не приходило</p>')+'</div>'
  +'<div class="c"><b>Настройки</b><label>Имя</label><input id="sn" value="'+esc(me.name)+'"><label>Номер Kaspi</label><input id="sk" value="'+esc(me.kaspi)+'"><button class="p" id="sb">Сохранить</button></div>'
  +'<div class="c"><b>История</b>'+(rest.map(function(d){return row(d,0)}).join('')||'<p class="mu">Пусто</p>')+'</div>';
  $('lo').onclick=function(e){e.preventDefault();localStorage.removeItem('tk');T=null;login()};
  var tts=function(){return $('tts').checked},ref=function(){panel()};
  $('pl').parentNode.onclick=function(e){var c=e.target.dataset.c,x=e.target.dataset.x;if(c)api('/api/confirm',{id:c,action:'confirm',tts:tts()}).then(ref);if(x)api('/api/confirm',{id:x,action:'reject'}).then(ref)};
  document.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){api('/api/replay',{id:b.dataset.r,tts:tts()})}});
  $('mb').onclick=function(){api('/api/manual',{name:$('mn').value,amount:$('ma').value,msg:$('mm').value,tts:tts()}).then(ref).catch(function(e){alert(e.error)})};
  $('au').onchange=function(){api('/api/settings',{name:$('sn').value,kaspi:$('sk').value,auto:$('au').checked})};
  $('ts').onclick=function(){api('/api/test',{})};
  $('sb').onclick=function(){api('/api/settings',{name:$('sn').value,kaspi:$('sk').value,auto:$('au').checked}).then(ref)};
 }).catch(function(){login()})}
if(T)panel();else login();
setInterval(function(){if(T&&document.activeElement.tagName!=='INPUT'&&$('pl'))panel()},15000);
</script></body></html>
