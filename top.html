<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рейтинг стримеров TikTok LIVE по донатам — Донат-алерт</title>
<meta name="description" content="Рейтинг лучших стримеров TikTok LIVE по донатам Kaspi: топ за всё время и за месяц. Поддержите любимого стримера.">
<link rel="canonical" href="{{URL}}/top">
<meta property="og:type" content="website"><meta property="og:title" content="Рейтинг стримеров по донатам"><meta property="og:url" content="{{URL}}/top">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&subset=cyrillic&display=swap">
<style>
:root{--c1:#ff4d5e;--c2:#ff8a3d;--bg:#0d0d14;--card:#16161f;--ln:#262634;--tx:#f4f3f8;--mut:#9a98ab;--in:#1d1d29}
@media(prefers-color-scheme:light){:root{--bg:#f4f3f8;--card:#fff;--ln:#e4e2ec;--tx:#17161d;--mut:#6c6a7a;--in:#f4f3f8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Manrope',system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 40% at 50% -10%,color-mix(in srgb,var(--c1) 30%,transparent),transparent 70%)}
.w{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 14px 50px}
nav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 4px}.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center;color:var(--tx);text-decoration:none}.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(130deg,var(--c1),var(--c2))}
select{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;font:inherit;font-weight:700;font-size:14px}
h1{font-size:30px;margin:18px 0 4px;font-weight:800}.sub{color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--ln);background:var(--card);color:var(--mut);border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.tab.on{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--c1),var(--c2))}
.r{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--tx)}
.r:hover{border-color:var(--c1)}.k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--in);color:var(--mut)}
.r:nth-child(-n+3) .k{color:#fff;background:linear-gradient(130deg,var(--c1),var(--c2))}
.m{flex:1;min-width:0}.nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ct{color:var(--mut);font-size:13px}.s{font-weight:800;white-space:nowrap}
.e{text-align:center;color:var(--mut);padding:30px 0}.note{color:var(--mut);font-size:12px;margin-top:14px;text-align:center}
</style></head><body><div class="w">
<nav><a class="logo" href="/"><i></i>Донат-алерт</a><select id="lg"><option value="ru">RU</option><option value="en">EN</option><option value="kk">KZ</option></select></nav>
<h1 id="h">Рейтинг стримеров</h1><p class="sub" id="sb">Лучшие стримеры сайта по донатам</p>
<div class="tabs"><button class="tab on" data-by="total" id="b1">По сумме</button><button class="tab" data-by="count" id="b2">По числу донатов</button><button class="tab" data-p="all" id="p1">За всё время</button><button class="tab" data-p="month" id="p2">За 30 дней</button></div>
<div id="ls"><div class="e">…</div></div>
<div class="note" id="nt">Суммы указаны в валюте стримера. Свою страницу в рейтинге можно скрыть в настройках.</div>
</div>
<script>
var L={ru:{h:'Рейтинг стримеров',sb:'Лучшие стримеры сайта по донатам',b1:'По сумме',b2:'По числу донатов',p1:'За всё время',p2:'За 30 дней',nt:'Суммы указаны в валюте стримера. Свою страницу в рейтинге можно скрыть в настройках.',e:'Пока никого в рейтинге',c:'донатов'},
en:{h:'Streamer ranking',sb:'Top streamers of the site by donations',b1:'By amount',b2:'By donation count',p1:'All time',p2:'Last 30 days',nt:'Amounts are in each streamer\'s currency. You can hide your page from the ranking in settings.',e:'Nobody in the ranking yet',c:'donations'},
kk:{h:'Стримерлер рейтингі',sb:'Донат бойынша сайттың үздік стримерлері',b1:'Сома бойынша',b2:'Донат саны бойынша',p1:'Барлық уақыт',p2:'30 күн',nt:'Сомалар стример валютасында көрсетілген. Бетіңізді рейтингтен баптауда жасыруға болады.',e:'Рейтингте әзірге ешкім жоқ',c:'донат'}};
var $=function(i){return document.getElementById(i)},lang='ru',by='total',per='all';
try{lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('lang')||(navigator.language||'ru').slice(0,2)}catch(e){}if(!L[lang])lang='ru';
function ap(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}document.documentElement.lang=l;$('lg').value=l;['h','sb','b1','b2','p1','p2','nt'].forEach(function(k){$(k).textContent=L[l][k]});load()}
function fmt(n,c){return Number(n).toLocaleString('ru-RU')+' '+c}
function load(){fetch('/api/top?by='+by+'&period='+per).then(function(r){return r.json()}).then(function(d){var o=$('ls');o.innerHTML='';
 if(!d.list.length){o.innerHTML='<div class="e">'+L[lang].e+'</div>';return}
 d.list.forEach(function(x,i){var a=document.createElement('a');a.className='r';a.href='/s/'+x.slug;a.innerHTML='<div class="k"></div><div class="m"><div class="nm"></div><div class="ct"></div></div><div class="s"></div>';
  a.children[0].textContent=i+1;a.querySelector('.nm').textContent=x.name;a.querySelector('.ct').textContent=x.count+' '+(lang==='en'&&x.count===1?'donation':L[lang].c);a.querySelector('.s').textContent=fmt(x.total,x.cur);o.appendChild(a)})}).catch(function(){})}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){if(b.dataset.by){by=b.dataset.by;['b1','b2'].forEach(function(i){$(i).classList.toggle('on',$(i)===b)})}else{per=b.dataset.p;['p1','p2'].forEach(function(i){$(i).classList.toggle('on',$(i)===b)})}load()}});
$('p1').classList.add('on');$('lg').onchange=function(){ap(this.value)};ap(lang);
</script></body></html>
