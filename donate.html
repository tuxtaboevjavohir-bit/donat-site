<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Донат</title><style>:root{--bg:#f6f5f2;--cd:#fff;--tx:#1c1b19;--mu:#6b6860;--ln:#e3e0d9;--ac:#e8333c}@media(prefers-color-scheme:dark){:root{--bg:#161615;--cd:#212120;--tx:#f1efe9;--mu:#9c998f;--ln:#34332f}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.w{max-width:640px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;margin:0 0 4px}.s{color:var(--mu);font-size:14px;margin:0 0 16px}.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}input,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.r{display:flex;gap:10px}.r>*{flex:1}button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;padding:10px 14px}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:14px;padding:13px}button.z{padding:6px 10px;font-size:13px}.er{color:var(--ac);font-size:14px;margin-top:8px}.it{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.it:first-child{border-top:0}.it .m{flex:1;min-width:0;overflow-wrap:anywhere}.it b{white-space:nowrap}.mu{color:var(--mu);font-size:14px}.t{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}code{display:block;word-break:break-all;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;font-size:13px;margin-top:6px}</style></head><body><div class="w" id="a"><p class="mu">Загрузка…</p></div>
<script>
var slug=location.pathname.split('/')[2],A=document.getElementById('a'),$=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
fetch('/api/streamer/'+slug).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(s){
 document.title='Донат · '+s.name;
 A.innerHTML='<h1>Поддержать '+esc(s.name)+'</h1><p class="s">Ваше имя и сообщение появятся в прямом эфире после подтверждения стримером.</p>'
 +'<div class="c"><b>Шаг 1. Переведите на Kaspi</b><code>'+esc(s.kaspi||'номер не указан')+'</code></div>'
 +'<div class="c"><b>Шаг 2. Сообщите о переводе</b><label>Имя</label><input id="n" maxlength="40"><div class="r"><div><label>Сумма, ₸</label><input id="m" type="number" inputmode="numeric"></div></div><label>Сообщение</label><textarea id="t" maxlength="200" rows="3" style="width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit"></textarea><div class="er" id="er"></div><button class="p" id="b">Я перевёл(а)</button></div>';
 $('b').onclick=function(){fetch('/api/donate/'+slug,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('n').value,amount:$('m').value,msg:$('t').value})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})}).then(function(){A.innerHTML='<h1>Спасибо!</h1><p class="s">Стример увидит заявку и подтвердит её после проверки перевода.</p>'}).catch(function(e){$('er').textContent=e.error||'Ошибка'})}
}).catch(function(){A.innerHTML='<h1>Страница не найдена</h1>'});
</script></body></html>
