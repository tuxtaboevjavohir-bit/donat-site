<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оверлей</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/alert.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Rubik',system-ui,sans-serif;color:#fff}
#st{position:fixed;inset:0;display:flex;justify-content:center;padding:36px 24px;pointer-events:none}
#st.bottom{align-items:flex-end}#st.center{align-items:center}#st.top{align-items:flex-start}
.wrap{position:fixed;inset:0;padding:16px;display:flex;align-items:flex-start;justify-content:flex-start}
</style></head><body>
<script src="/alert.js"></script><div id="st" class="bottom"></div><div id="wg" class="wrap" style="display:none"></div>
<script>
var parts=location.pathname.split('/'),qs=new URLSearchParams(location.search),slug=parts[2],key=qs.get('key')||'',W=qs.get('w')||'alert';
if(parts[1]==='o'){key=parts[3]||'';W=parts[4]||'alert'}
var AL=(W==='alert'||W==='phone'),PHONE=W==='phone',BGM=qs.get('bg')||'dark',CMP=qs.get('compact')==='1';
var st=document.getElementById('st'),wg=document.getElementById('wg'),q=[],busy=false,ac=null,loadedFont='';
var CUR='₸',LANG='ru',PH={ru:' задонатил(а)',en:' donated',kk:' донат жіберді'},SAYS={ru:' пишет: ',en:' says: ',kk:' жазады: '},VL={ru:'ru-RU',en:'en-US',kk:'kk-KZ'},GOALT={ru:'Цель сбора',en:'Donation goal',kk:'Жинау мақсаты'},OF={ru:' из ',en:' of ',kk:' / '},TOPT={ru:'Топ донатеров',en:'Top donors',kk:'Үздік донатерлер'},EMPTY={ru:'Пока пусто',en:'Nothing yet',kk:'Әзірге бос'};
function fmt(n){return Number(n).toLocaleString('ru-RU')+' '+CUR}
var TH='classic';
function style(s){if(!s)return;CUR=s.cur||'₸';LANG=PH[s.lang]?s.lang:'ru';TH=s.theme||'classic';SS=s;
 if(loadedFont!==s.font){loadedFont=s.font;var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(s.font).replace(/%20/g,'+')+'&subset=cyrillic&display=swap';document.head.appendChild(l);document.documentElement.style.setProperty('--f',"'"+s.font+"'")}}
var SS=null;
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(a,f,t0,len,vol,type){var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;var t=a.currentTime+t0;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.05)}
function sound(kind,vol){var a=ctx();if(!a||kind==='none')return;var v=(vol==null?70:vol)/100*.35;
 if(kind==='bell'){tone(a,880,0,1.1,v,'triangle');tone(a,1320,.02,.9,v*.6,'sine');tone(a,1760,.04,.7,v*.3,'sine')}
 else if(kind==='coin'){tone(a,988,0,.12,v,'square');tone(a,1319,.1,.45,v,'square')}
 else{[660,880,1320].forEach(function(f,i){tone(a,f,i*.12,.5,v)})}}
var CURW={'₸':'тенге','₽':'рублей','$':'долларов','€':'евро','₴':'гривен','сом':'сомов'};
function speak(v){try{var S=SS||{},who=S.tw||'all',txt='';
 var nm=v.name,am=v.amount+' '+(CURW[CUR]||CUR);
 if(who==='msg'){if(!v.msg)return;txt=v.msg}else if(who==='name')txt=nm+PH[LANG]+' '+am;else txt=nm+PH[LANG]+' '+am+(v.msg?'. '+v.msg:'');
 txt=txt.replace(/https?:\/\/\S+/g,'').slice(0,S.tm||150);if(!txt.trim())return;
 var u=new SpeechSynthesisUtterance(txt);u.lang=VL[LANG];u.rate=(S.tr||100)/100;u.pitch=(S.tp||100)/100;u.volume=(S.tl==null?100:S.tl)/100;
 if(S.tv){var vs=speechSynthesis.getVoices();for(var i=0;i<vs.length;i++)if(vs[i].name===S.tv){u.voice=vs[i];u.lang=vs[i].lang;break}}
 speechSynthesis.speak(u)}catch(x){}}
function next(){
 if(busy||!q.length)return;busy=true;var v=q.shift();style(v.style);
 st.className=PHONE?'center':((v.style&&v.style.pos)||'bottom');
 var e=document.createElement('div');e.className='al t-'+TH;e.innerHTML='<div class="in-box"><div class="who"></div><div class="sum"></div><div class="amsg"></div><div class="bar"></div></div>';
 var b=e.firstChild;b.children[0].innerHTML='<b></b><span></span>';b.children[0].firstChild.textContent=v.name;b.children[0].lastChild.textContent=PH[LANG];
 b.children[1].textContent=fmt(v.amount);b.children[2].textContent=v.msg||'';if(!v.msg)b.children[2].style.display='none';
 b.children[3].style.animationDuration=(v.dur||8)+'s';
 if(v.style&&v.style.brand){var br=document.createElement('div');br.className='brand';br.textContent='Донат-алерт · '+location.host;b.insertBefore(br,b.children[3])}
 st.innerHTML='';st.appendChild(e);requestAnimationFrame(function(){requestAnimationFrame(function(){e.classList.add('in')})});
 sound(v.style&&v.style.sound,v.style&&v.style.vol);
 if(v.tts&&window.speechSynthesis)speak(v);
 setTimeout(function(){e.classList.remove('in');e.classList.add('out');setTimeout(function(){st.innerHTML='';busy=false;next()},450)},(v.dur||8)*1000)}
function wcls(c){return 'w '+(c||'')+' t-'+TH}
var MP={cur:null,player:null,ready:false,queue:[]};
var PER=/-day$/.test(W)?'day':/-month$/.test(W)?'month':'all',BASE=W.replace(/-(day|month)$/,''),CNT=Number(qs.get('n'))||10;
function widget(){
 if(BASE==='faceit'){fetch('/api/fw/'+slug+'?key='+encodeURIComponent(key)).then(function(r){return r.json()}).then(function(d){if(d.style)style(d.style);wg.innerHTML=Faceit.render(d,LANG,TH)}).catch(function(){});return}
 fetch('/api/widget/'+slug+'?key='+encodeURIComponent(key)+'&p='+PER+'&n='+CNT).then(function(r){return r.json()}).then(function(d){
  if(d.error)return;style(d.style);var L=d.locks||{};
  if(BASE==='goal'){
   if(L.goal||!d.goal.on){wg.innerHTML='';return}
   var p=Math.min(100,Math.round(d.goal.current/d.goal.target*100));
   wg.innerHTML='<div class="'+wcls()+'"><div class="gt"><div></div><span>'+fmt(d.goal.current)+OF[LANG]+fmt(d.goal.target)+'</span></div><div class="track"><div class="fill"></div></div><div class="gp">'+p+'%</div></div>';
   wg.querySelector('.gt div').textContent=d.goal.title||GOALT[LANG];
   setTimeout(function(){var f=wg.querySelector('.fill');if(f)f.style.width=p+'%'},50)}
  else if(BASE==='top'){
   var tl={day:d.titles&&d.titles.day,month:d.titles&&d.titles.month,all:d.titles&&d.titles.all};
   wg.innerHTML=TopCover.render((d.style&&d.style.tc)||'hero',d.top,d.need,CUR,LANG,TopCover.title(PER,LANG,tl[PER]))}
  else if(BASE==='last'){
   var l=d.last;if(!l){wg.innerHTML='';return}
   wg.innerHTML='<div class="'+wcls('last')+'"><div class="ln"></div><div class="ls"></div><div class="lm"></div></div>';var q=wg.firstChild;
   q.children[0].textContent=l.name+PH[LANG];q.children[1].textContent=fmt(l.amount);q.children[2].textContent=l.msg||''}
  else if(BASE==='ticker'){
   if(L.ticker||!d.tick.length){wg.innerHTML='';return}
   var tl2={day:d.titles&&d.titles.day,month:d.titles&&d.titles.month,all:d.titles&&d.titles.all};
   wg.innerHTML=TopCover.tick((d.style&&d.style.tk)||'classic',d.tick,CUR,TopCover.title(PER,LANG,tl2[PER])+':',false)}
  else if(BASE==='leader'){
   if(L.leader||!d.leader){wg.innerHTML='';return}
   wg.innerHTML='<div class="'+wcls('lead')+'"><div class="cr">👑</div><div class="lt">'+({ru:'Лидер',en:'Top donor',kk:'Көшбасшы'}[LANG])+'</div><div class="ln"></div><div class="ls"></div></div>';
   wg.querySelector('.ln').textContent=d.leader.name;wg.querySelector('.ls').textContent=fmt(d.leader.total)}
  else if(BASE==='music'){musicUpdate(d)}
 }).catch(function(){})}
function musicUpdate(d){
 MP.queue=d.music||[];
 if(!wg.firstChild){wg.innerHTML='<div class="'+wcls('mus')+'"><div class="yt"><div id="ytp"></div></div><div class="mi"><div class="mt">♪ Заказ от зрителя</div><div class="mn" id="mnm">Очередь пуста</div><div class="mm" id="mmm"></div></div></div>';loadYT()}
 if(!MP.cur||MP.queue.every(function(x){return x.id!==MP.cur.id})){if(!MP.playing)musicNext()}}
function loadYT(){if(window.YT&&YT.Player)return ytReady();var t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);window.onYouTubeIframeAPIReady=ytReady}
function ytReady(){MP.player=new YT.Player('ytp',{width:'240',height:'135',playerVars:{autoplay:1,playsinline:1},events:{onReady:function(){MP.ready=true;musicNext()},onStateChange:function(e){if(e.data===0)musicDone()}}})}
function musicNext(){if(!MP.ready||MP.playing)return;var n=MP.queue[0];if(!n){var a=document.getElementById('mnm');if(a)a.textContent='Очередь пуста';document.getElementById('mmm').textContent='';MP.cur=null;return}
 MP.cur=n;MP.playing=true;document.getElementById('mnm').textContent=n.name+' · '+fmt(n.amount);document.getElementById('mmm').textContent=n.msg||'';MP.player.loadVideoById(n.vid)}
function musicDone(){var c=MP.cur;MP.playing=false;if(!c)return;MP.queue=MP.queue.filter(function(x){return x.id!==c.id});
 fetch('/api/mdone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:slug,key:key,id:c.id})}).catch(function(){});musicNext()}
function open(){var es=new EventSource('/api/stream/'+slug+'?key='+encodeURIComponent(key));
 es.onmessage=function(m){var d;try{d=JSON.parse(m.data)}catch(e){return}
  if(d.type==='alert'||(!d.type&&d.name)){if(AL){q.push(d);next();if(PHONE)phLog(d)}}else if(d.type==='update'&&!AL)widget()};
 es.onerror=function(){es.close();setTimeout(open,3000)}}
document.addEventListener('click',ctx);
if(!AL){st.style.display='none';wg.style.display='flex';widget();setInterval(widget,30000)}
else fetch('/api/widget/'+slug+'?key='+encodeURIComponent(key)).then(function(r){return r.json()}).then(function(d){if(d.style)style(d.style)}).catch(function(){});
open();
/* ===== режим телефона ===== */
var phLast=[];
function phLog(d){phLast.unshift(d);phLast=phLast.slice(0,4);var l=document.getElementById('phl');if(!l)return;l.innerHTML='';phLast.forEach(function(x){var r=document.createElement('div');r.className='phr';r.innerHTML='<b></b><span></span>';r.firstChild.textContent=x.name;r.lastChild.textContent=fmt(x.amount);l.appendChild(r)})}
if(PHONE){
 var css=document.createElement('style');css.textContent='html,body{background:'+(BGM==='transparent'?'transparent':BGM==='green'?'#00b140':'radial-gradient(circle at 20% 15%,#4b3a9e,transparent 55%),radial-gradient(circle at 85% 90%,#0e7490,transparent 55%),#0e0e16')+'}#st{padding:'+(CMP?'4px':'24px 14px')+'}'+(CMP?'#pht,#phl{display:none!important}.al{max-width:none!important}':'')+'#phs{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5;background:rgba(10,10,16,.92)}#phs h2{margin:0;font-size:24px}#phs p{margin:0;color:#b9b9cc;max-width:320px;line-height:1.45}#phb{border:0;border-radius:16px;padding:16px 34px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(120deg,#ff4d5e,#ff8a3d);font-family:inherit}#pht{position:fixed;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#8a8aa0;pointer-events:none}#phl{position:fixed;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}.phr{font-size:13px;color:#9a9ab0;display:flex;gap:8px}.phr b{color:#ccd}';document.head.appendChild(css);
 var s=document.createElement('div');s.id='phs';s.innerHTML='<h2>Режим телефона</h2><p>Нажмите кнопку: включится звук и озвучка, а экран не будет гаснуть. Донаты появятся здесь.</p><button id="phb" type="button">▶ Включить</button>';document.body.appendChild(s);
 var t=document.createElement('div');t.id='pht';t.textContent='Ждём донаты…';document.body.appendChild(t);var l=document.createElement('div');l.id='phl';document.body.appendChild(l);
 st.className='center';var wl=null;
 function lock(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(x){wl=x;x.addEventListener('release',function(){wl=null})}).catch(function(){})}catch(e){}}
 document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&document.getElementById('phs')===null)lock()});
 document.getElementById('phb').onclick=function(){ctx();try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}lock();try{var de=document.documentElement;(de.requestFullscreen||de.webkitRequestFullscreen||function(){}).call(de)}catch(e){}s.remove();t.textContent='Готово: ждём донаты'}}
</script></body></html>
